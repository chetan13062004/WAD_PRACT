<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 50px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="mb-4 text-center">Event Registration Form</h2>
  <form class="needs-validation" novalidate>
    <!-- Name -->
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="name" placeholder="Full Name" required data-bs-toggle="tooltip" title="Enter your full name">
      <label for="name">Full Name</label>
      <div class="invalid-feedback">Name is required.</div>
    </div>

    <!-- Email -->
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="email" placeholder="name@example.com" required data-bs-toggle="tooltip" title="Enter a valid email address">
      <label for="email">Email address</label>
      <div class="invalid-feedback">Please enter a valid email.</div>
    </div>

    <!-- Phone Number -->
    <div class="form-floating mb-3">
      <input type="tel" class="form-control" id="phone" placeholder="1234567890" pattern="[0-9]{10}" required data-bs-toggle="tooltip" title="Enter 10-digit phone number">
      <label for="phone">Phone Number</label>
      <div class="invalid-feedback">Enter a valid 10-digit phone number.</div>
    </div>

    <!-- Event Type -->
    <div class="form-floating mb-3">
      <select class="form-select" id="event" required data-bs-toggle="tooltip" title="Choose your event type">
        <option value="" disabled selected>Select an event</option>
        <option>Workshop</option>
        <option>Seminar</option>
        <option>Hackathon</option>
        <option>Webinar</option>
      </select>
      <label for="event">Event Type</label>
      <div class="invalid-feedback">Please select an event.</div>
    </div>

    <!-- Date -->
    <div class="form-floating mb-3">
      <input type="date" class="form-control" id="date" required data-bs-toggle="tooltip" title="Select the event date">
      <label for="date">Event Date</label>
      <div class="invalid-feedback">Please choose a date.</div>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary w-100" type="submit">Register</button>
  </form>
</div>

<!-- Bootstrap JS (for tooltips & validation) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable tooltips
  const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
  tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el))

  // Bootstrap validation
  (function () {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>

</body>
</html>
