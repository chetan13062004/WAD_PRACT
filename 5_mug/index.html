<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Listing with Filters</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

  <div class="container-fluid my-4">
    <div class="row">
      
      <!-- Sidebar Filters -->
      <div class="col-lg-3 mb-4">
        <h5>Filters</h5>

        <!-- Target Market -->
        <div class="mb-3">
          <h6>Target Market</h6>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="USA" id="usa">
            <label class="form-check-label" for="usa">USA</label>
          </div>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="Canada" id="canada">
            <label class="form-check-label" for="canada">Canada</label>
          </div>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="UK" id="uk">
            <label class="form-check-label" for="uk">United Kingdom</label>
          </div>
        </div>

        <!-- Print Area -->
        <div class="mb-3">
          <h6>Print Area</h6>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="AllAreas" id="allAreas">
            <label class="form-check-label" for="allAreas">All Areas</label>
          </div>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="FrontSide" id="frontSide">
            <label class="form-check-label" for="frontSide">Front Side</label>
          </div>
        </div>

        <!-- Print Providers -->
        <div class="mb-3">
          <h6>Print Providers</h6>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="ArtsAdd" id="artsadd">
            <label class="form-check-label" for="artsadd">ArtsAdd</label>
          </div>
          <div class="form-check">
            <input class="form-check-input filter-checkbox" type="checkbox" value="DistrictPhoto" id="districtphoto">
            <label class="form-check-label" for="districtphoto">District Photo</label>
          </div>
        </div>
      </div>

      <!-- Product Grid Section -->
      <div class="col-lg-9">

        <!-- Sort Dropdown -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Mugs</h4>
          <div>
            <select class="form-select" style="width: 200px;">
              <option selected>Sort by Popularity</option>
              <option value="1">Sort by Price: Low to High</option>
              <option value="2">Sort by Price: High to Low</option>
            </select>
          </div>
        </div>

        <!-- Product Cards -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="productGrid">

          <!-- Product 1 -->
          <div class="col product-card" data-market="USA" data-print="AllAreas" data-provider="ArtsAdd">
            <div class="card h-100 position-relative">
              <span class="badge-custom">Bestseller</span>
              <img src="image.png" class="card-img-top" alt="Mug">
              <div class="card-body">
                <h5 class="card-title">Ceramic Mug 11oz</h5>
                <p class="card-text text-success">From USD $4.40</p>
                <a href="#" class="btn btn-primary btn-sm">View Product</a>
              </div>
            </div>
          </div>

          <!-- Product 2 -->
          <div class="col product-card" data-market="Canada" data-print="FrontSide" data-provider="DistrictPhoto">
            <div class="card h-100 position-relative">
              <img src="image.png" class="card-img-top" alt="Mug">
              <div class="card-body">
                <h5 class="card-title">Accent Coffee Mug</h5>
                <p class="card-text text-success">From USD $5.20</p>
                <a href="#" class="btn btn-primary btn-sm">View Product</a>
              </div>
            </div>
          </div>

          <!-- Product 3 -->
          <div class="col product-card" data-market="UK" data-print="AllAreas" data-provider="ArtsAdd">
            <div class="card h-100 position-relative">
              <img src="image.png" class="card-img-top" alt="Mug">
              <div class="card-body">
                <h5 class="card-title">White Ceramic Mug</h5>
                <p class="card-text text-success">From USD $6.00</p>
                <a href="#" class="btn btn-primary btn-sm">View Product</a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External JS -->
  <script src="script.js"></script>

</body>
</html>
